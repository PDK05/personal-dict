<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Từ Điển Cá Nhân</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8f9fa;
            color: #333;
            max-width: 600px;
            margin: 40px auto;
            padding: 0 20px;
        }
        h1 {
            text-align: center;
            color: #1a73e8;
            margin-bottom: 24px;
        }
        .search-box {
            width: 100%;
            padding: 12px 16px;
            font-size: 16px;
            border: 2px solid #dfe1e5;
            border-radius: 8px;
            outline: none;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        .search-box:focus {
            border-color: #1a73e8;
            box-shadow: 0 1px 6px rgba(32,33,36,.1);
        }
        #status {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
            font-style: italic;
        }
    </style>
</head>
<body>

    <h1>Từ Điển Cá Nhân</h1>
  
    <input type="text" id="searchInput" class="search-box" placeholder="Nhập từ cần tra cứu (Tiếng Trung, Pinyin, nghĩa)..." autofocus>
    
    <div id="status"></div>

    <div id="resultContainer"></div>
  
    <script type="module" src="./script.js"></script>
</body>
</html>
