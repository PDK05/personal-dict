<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SinicIME - Fixed Single Box</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        header { background: var(--panel-bg); border-bottom: 1px solid var(--border-color); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 1.1rem; font-weight: 600; color: var(--accent); }
        .container { flex: 1; padding: 20px; display: flex; flex-direction: column; max-width: 800px; margin: 0 auto; width: 100%; }
        .pane-header { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 8px; display: flex; justify-content: space-between; }
        textarea { flex: 1; width: 100%; background: var(--panel-bg); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; font-size: 1.3rem; line-height: 1.6; resize: none; outline: none; min-height: 300px; }
        textarea:focus { border-color: var(--accent); }
        .hints { margin-top: 10px; font-size: 0.85rem; color: var(--text-muted); background: var(--panel-bg); border: 1px solid var(--border-color); padding: 10px; border-radius: 6px; }
        footer { background: var(--panel-bg); border-top: 1px solid var(--border-color); padding: 10px 20px; font-size: 0.8rem; color: var(--text-muted); display: flex; justify-content: space-between; }
    </style>
</head>
<body>

    <header>
        <h1>⌨️ SinicIME Single-Box Engine</h1>
        <div>
            <select id="langMode" style="background: var(--bg-color); color: var(--text-main); border: 1px solid var(--border-color); padding: 6px 10px; border-radius: 6px; outline: none;">
                <option value="thai_syllable">Tiếng Thái (Gõ kzin + Space $\rightarrow$ กิน)</option>
            </select>
        </div>
    </header>

    <div class="container">
        <div class="pane-header">
            <span>Văn bản trực tiếp</span>
            <span id="charCount">0 ký tự</span>
        </div>
        <textarea id="editorBox" placeholder="Gõ kzin rồi ấn phím Cách (Space)..."></textarea>
        <div class="hints">
            💡 <strong>Cách test:</strong> Gõ chữ <code>kzin</code> (không có khoảng trắng), sau đó bấm phím <strong>Cách (Space)</strong>. Từ này sẽ tự động chuyển thành <code>กิน</code>.
        </div>
    </div>

    <footer>
        <span>Trạng thái: Ready</span>
        <span>SinicIME Mobile</span>
    </footer>

    <script>
        const editor = document.getElementById('editorBox');
        const charCount = document.getElementById('charCount');

        // Bảng từ điển ánh xạ tổ hợp phím
        const syllableDictionary = {
            'kzin': 'กิน',
            'nam': 'น้ำ',
            'pa': 'ป่า',
            'krungthep': 'กรุงเทพมหานคร'
        };

        editor.addEventListener('keyup', function(e) {
            // Kiểm tra khi người dùng vừa nhả phím Cách (Space)
            if (e.code === 'Space' || e.key === ' ') {
                let content = editor.value;
                let cursorPos = editor.selectionStart;

                // Cắt chuỗi từ đầu đến vị trí con trỏ
                let textBefore = content.substring(0, cursorPos);
                let textAfter = content.substring(cursorPos);

                // Tách các từ dựa trên khoảng trắng
                // Loại bỏ khoảng trắng thừa ở cuối cụm vừa gõ để lấy từ gốc (vd: "kzin ")
                let trimmedBefore = textBefore.trimEnd();
                let lastSpaceIndex = trimmedBefore.lastIndexOf(' ');
                
                let currentWord = lastSpaceIndex === -1 ? trimmedBefore : trimmedBefore.substring(lastSpaceIndex + 1);

                // Nếu từ vừa gõ khớp với từ điển tổ hợp
                if (currentWord && syllableDictionary[currentWord]) {
                    let translatedWord = syllableDictionary[currentWord];
                    
                    // Thay thế từ gốc bằng từ đã dịch
                    let baseText = lastSpaceIndex === -1 ? '' : trimmedBefore.substring(0, lastSpaceIndex + 1);
                    let newTextBefore = baseText + translatedWord + ' ';
                    
                    editor.value = newTextBefore + textAfter;
                    
                    // Đặt lại con trỏ đúng sau khoảng trắng của từ mới thay thế
                    let newPos = newTextBefore.length;
                    editor.setSelectionRange(newPos, newPos);
                }

                charCount.innerText = `${editor.value.length} ký tự`;
            }
        });

        editor.addEventListener('input', function() {
            charCount.innerText = `${editor.value.length} ký tự`;
        });
    </script>
</body>
</html>
