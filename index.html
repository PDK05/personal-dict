<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Từ Điển Tiếng H'Mông</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --primary: #0f766e;
            --border-color: #e2e8f0;
            --tag-bg: #f0fdf4;
            --tag-text: #15803d;
        }
        body { font-family: sans-serif; background-color: var(--bg-color); color: var(--text-main); margin: 0; padding: 40px 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 680px; }
        .header { text-align: center; margin-bottom: 25px; }
        .search-box { width: 100%; padding: 14px 16px; font-size: 16px; border: 2px solid var(--border-color); border-radius: 10px; box-sizing: border-box; outline: none; margin-bottom: 20px; }
        .search-box:focus { border-color: var(--primary); }
        .result-list { display: flex; flex-direction: column; gap: 12px; }
        .result-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 16px 20px; }
        .word-main { font-size: 20px; font-weight: 700; color: var(--primary); }
        .phonetic-badge { background: var(--tag-bg); color: var(--tag-text); padding: 2px 6px; border-radius: 4px; font-size: 12px; font-weight: 600; margin-left: 8px; }
        .meaning { margin-top: 8px; font-size: 14px; }
        .state-msg { text-align: center; color: var(--text-sub); padding: 30px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🌿 Từ Điển Tiếng H'Mông</h1>
        <p>Đọc dữ liệu độc lập từ file JSON</p>
    </div>

    <input type="text" id="searchBox" class="search-box" placeholder="Gõ từ cần tra..." autofocus disabled>
    <div id="stats" style="font-size: 13px; color: #64748b; margin-bottom: 12px;">Đang tải dữ liệu từ server...</div>
    
    <div id="resultList" class="result-list"></div>
</div>

<script>
    let dictionary = [];

    // Tải file JSON độc lập khi mở trang
    async function loadDictionary() {
        try {
            const response = await fetch('./dict.json');
            if (!response.ok) throw new Error('Không thể tải file dict.json');
            
            dictionary = await response.json();
            
            document.getElementById('searchBox').disabled = false;
            document.getElementById('stats').innerText = `Đã tải xong ${dictionary.length} mục từ từ file dữ liệu.`;
            document.getElementById('resultList').innerHTML = `<div class="state-msg">Nhập từ khóa vào ô phía trên để tra cứu.</div>`;
        } catch (err) {
            document.getElementById('stats').innerText = 'Lỗi tải dữ liệu: ' + err.message;
        }
    }

    const searchBox = document.getElementById('searchBox');
    const resultList = document.getElementById('resultList');

    searchBox.addEventListener('input', (e) => {
        const query = e.target.value.trim().toLowerCase();
        if (!query) {
            resultList.innerHTML = `<div class="state-msg">Nhập từ khóa vào ô phía trên để tra cứu.</div>`;
            return;
        }

        const matches = dictionary.filter(item => 
            item.tu.toLowerCase().includes(query) || 
            item.phien_am.toLowerCase().includes(query) || 
            item.nghia.toLowerCase().includes(query)
        );

        if (matches.length === 0) {
            resultList.innerHTML = `<div class="state-msg">Không tìm thấy từ nào cho "<strong>${query}</strong>"</div>`;
            return;
        }

        resultList.innerHTML = matches.map(item => `
            <div class="result-card">
                <div>
                    <span class="word-main">${item.tu}</span>
                    <span class="phonetic-badge">[${item.phien_am}]</span>
                </div>
                <div class="meaning"><strong>[${item.tu_loai}]</strong> ${item.nghia}</div>
            </div>
        `).join('');
    });

    loadDictionary();
</script>

</body>
</html>
