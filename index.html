<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SinicIME - Phonetic Key Resolver</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        header { background: var(--panel-bg); border-bottom: 1px solid var(--border-color); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 1.1rem; font-weight: 600; color: var(--accent); }
        .main-container { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border-color); }
        @media (max-width: 768px) { .main-container { grid-template-columns: 1fr; } }
        .pane { background: var(--panel-bg); display: flex; flex-direction: column; padding: 20px; }
        .pane-header { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; margin-bottom: 10px; display: flex; justify-content: space-between; }
        textarea { flex: 1; width: 100%; background: var(--bg-color); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; font-size: 1.1rem; line-height: 1.6; resize: none; outline: none; min-height: 180px; }
        textarea:focus { border-color: var(--accent); }
        .hints { margin-top: 10px; font-size: 0.85rem; color: var(--text-muted); background: rgba(0,0,0,0.2); padding: 8px; border-radius: 6px; }
        footer { background: var(--panel-bg); border-top: 1px solid var(--border-color); padding: 10px 20px; font-size: 0.8rem; color: var(--text-muted); display: flex; justify-content: space-between; }
    </style>
</head>
<body>

    <header>
        <h1>⚡ Phonetic Key Resolver Studio</h1>
        <div>
            <select id="resolverMode" style="background: var(--bg-color); color: var(--text-main); border: 1px solid var(--border-color); padding: 6px 10px; border-radius: 6px;">
                <option value="custom_rules">Quy tắc gõ ký tự (u $\rightarrow$ u ngắn, uu $\rightarrow$ u dài...)</option>
                <option value="telex_vi">Telex rút gọn (k $\rightarrow$ ko, g $\rightarrow$ giờ...)</option>
            </select>
        </div>
    </header>

    <div class="main-container">
        <div class="pane">
            <div class="pane-header">
                <span>Gõ phím (Raw Input)</span>
                <span id="charCount">0 ký tự</span>
            </div>
            <textarea id="inputBox" placeholder="Thử gõ: uu, oo, k, r..."></textarea>
            <div id="hintBox" class="hints">Quy tắc: uu $\rightarrow$ ū/u dài, oo $\rightarrow$ ō/o dài, k $\rightarrow$ ko...</div>
        </div>
        <div class="pane">
            <div class="pane-header">
                <span>Kết quả phân giải (Resolved Output)</span>
            </div>
            <textarea id="outputBox" placeholder="Kết quả hiện ở đây..." readonly></textarea>
        </div>
    </div>

    <footer>
        <span>Trạng thái: Custom Key Resolver Active</span>
        <span>SinicIME Engine</span>
    </footer>

    <script>
        const input = document.getElementById('inputBox');
        const output = document.getElementById('outputBox');
        const charCount = document.getElementById('charCount');
        const resolverMode = document.getElementById('resolverMode');

        // Hàm phân giải quy tắc gõ phím trực tiếp
        function resolveKeys(text, mode) {
            if (!text) return "";

            if (mode === 'custom_rules') {
                return text
                    // Xử lý nguyên âm kép theo ý bạn (ví dụ: uu thành u dài, oo thành o dài)
                    .replace(/uu/g, 'ū')
                    .replace(/oo/g, 'ō')
                    .replace(/aa/g, 'ā')
                    .replace(/ee/g, 'ē')
                    .replace(/ii/g, 'ī')
                    // Các biến đổi ký tự đơn lẻ hoặc cụm phím
                    .replace(/\bk\b/g, 'ko')
                    .replace(/\br\b/g, 'ro');
            } else if (mode === 'telex_vi') {
                return text
                    .replace(/aa/g, 'â')
                    .replace(/aw/g, 'ă')
                    .replace(/ee/g, 'ê')
                    .replace(/oo/g, 'ô')
                    .replace(/ow/g, 'ơ')
                    .replace(/dd/g, 'đ');
            }
            return text;
        }

        function handleProcess() {
            const val = input.value;
            const mode = resolverMode.value;
            
            charCount.innerText = `${val.length} ký tự`;
            output.value = resolveKeys(val, mode);
        }

        input.addEventListener('input', handleProcess);
        resolverMode.addEventListener('change', handleProcess);
    </script>
</body>
</html>
