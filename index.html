<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SinicIME - Mobile Real-time Resolver</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
        header { background: var(--panel-bg); border-bottom: 1px solid var(--border-color); padding: 12px 15px; display: flex; justify-content: space-between; align-items: center; }
        h1 { font-size: 1rem; font-weight: 600; color: var(--accent); }
        .container { flex: 1; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .pane-header { font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; display: flex; justify-content: space-between; }
        textarea { flex: 1; width: 100%; background: var(--panel-bg); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; font-size: 1.4rem; line-height: 1.6; resize: none; outline: none; }
        textarea:focus { border-color: var(--accent); }
        .hints { font-size: 0.8rem; color: var(--text-muted); background: var(--panel-bg); border: 1px solid var(--border-color); padding: 10px; border-radius: 6px; }
        footer { background: var(--panel-bg); border-top: 1px solid var(--border-color); padding: 10px 15px; font-size: 0.75rem; color: var(--text-muted); display: flex; justify-content: space-between; }
    </style>
</head>
<body>

    <header>
        <h1>⌨️ SinicIME Mobile Engine</h1>
        <span id="charCount" style="font-size: 0.8rem; color: var(--text-muted);">0 ký tự</span>
    </header>

    <div class="container">
        <div class="pane-header">
            <span>Khung gõ văn bản trực tiếp</span>
        </div>
        <textarea id="editorBox" placeholder="Gõ k, c, d... bàn phím sẽ tự chuyển đổi..."></textarea>
        <div class="hints">
            💡 <strong>Mẹo di động:</strong> Hệ thống sẽ tự động quét ký tự Latinh vừa gõ và đổi sang ký tự đích tương ứng ngay khi bạn nhập!
        </div>
    </div>

    <footer>
        <span>Trạng thái: Mobile Input Active</span>
        <span>SinicIME SPA</span>
    </footer>

    <script>
        const editor = document.getElementById('editorBox');
        const charCount = document.getElementById('charCount');

        // Bảng quy tắc chuyển đổi trực tiếp trên mobile
        const mobileMapping = {
            'kh': 'ข',
            'ng': 'ง',
            'ch': 'ฉ',
            'ph': 'ผ',
            'th': 'ถ',
            'k': 'ก',
            'c': 'ค',
            'j': 'จ',
            'd': 'ด',
            't': 'ต',
            'n': 'น',
            'b': 'บ',
            'p': 'ป',
            'm': 'ม',
            'y': 'ย',
            'r': 'ร',
            'l': 'ล',
            'w': 'ว',
            's': 'ส',
            'h': 'ห',
            'a': 'ะ',
            'i': 'ิ',
            'u': 'ุ'
        };

        editor.addEventListener('input', function(e) {
            let val = editor.value;
            
            // Tự động quét và thay thế các tổ hợp phím Latinh thành ký tự đích ngay lập tức
            // Sắp xếp các key theo chiều dài giảm dần để ưu tiên cụm dài trước (vd: kh trước k)
            let sortedKeys = Object.keys(mobileMapping).sort((a, b) => b.length - a.length);
            
            let cursor = editor.selectionStart;
            
            // Duyệt và thay thế các mẫu trong chuỗi
            sortedKeys.forEach(key => {
                let regex = new RegExp(key, 'g');
                val = val.replace(regex, mobileMapping[key]);
            });

            if (editor.value !== val) {
                editor.value = val;
                // Giữ vị trí con trỏ hợp lý
                editor.setSelectionRange(cursor, cursor);
            }

            charCount.innerText = `${editor.value.length} ký tự`;
        });
    </script>
</body>
</html>
