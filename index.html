<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Language Phonetic IME Studio</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        header { background: var(--panel-bg); border-bottom: 1px solid var(--border-color); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        h1 { font-size: 1.1rem; font-weight: 600; color: var(--accent); display: flex; align-items: center; gap: 8px; }
        .lang-select-wrapper { display: flex; align-items: center; gap: 8px; }
        select { background: var(--bg-color); color: var(--text-main); border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 6px; font-size: 0.9rem; outline: none; cursor: pointer; }
        select:focus { border-color: var(--accent); }
        .main-container { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border-color); }
        @media (max-width: 768px) { .main-container { grid-template-columns: 1fr; } }
        .pane { background: var(--panel-bg); display: flex; flex-direction: column; padding: 20px; }
        .pane-header { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; display: flex; justify-content: space-between; }
        textarea { flex: 1; width: 100%; background: var(--bg-color); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; font-size: 1.1rem; line-height: 1.6; resize: none; outline: none; }
        textarea:focus { border-color: var(--accent); }
        footer { background: var(--panel-bg); border-top: 1px solid var(--border-color); padding: 10px 20px; font-size: 0.8rem; color: var(--text-muted); display: flex; justify-content: space-between; }
        .rtl-badge { color: #f43f5e; font-weight: 600; display: none; }
    </style>
</head>
<body>

    <header>
        <h1>⌨️ Linguaevum IME Engine</h1>
        <div class="lang-select-wrapper">
            <label for="langSelect" style="font-size: 0.85rem; color: var(--text-muted);">Ngôn ngữ:</label>
            <select id="langSelect">
                <optgroup label="Hán-Nôm & Trung Hoa">
                    <option value="han_nom">漢喃 (Hán Nôm / Quốc ngữ)</option>
                    <option value="mandarin">官話 (Quan thoại - Pinyin)</option>
                    <option value="min_nan">閩南語 (Mân Nam - Pe̍h-ōe-jī)</option>
                    <option value="cantonese">粵語 (Quảng Đông - Jyutping)</option>
                </optgroup>
                <optgroup label="Đông Nam Á">
                    <option value="thai">ไทย (Tiếng Thái - RTGS)</option>
                    <option value="lao">ລາວ (Tiếng Lào)</option>
                    <option value="khmer">ខែ្មរ (Tiếng Khmer)</option>
                    <option value="burmese">မြန်မာ (Tiếng Miến Điện)</option>
                    <option value="malay">Bahasa Melayu (Tiếng Mã Lai)</option>
                </optgroup>
                <optgroup label="Tiếng Dân tộc & Địa phương VN">
                    <option value="muong">Mường</option>
                    <option value="tay">Tày</option>
                    <option value="nung">Nùng</option>
                    <option value="thai_den">Thái Đen</option>
                    <option value="hmoob">Hmoob (H'Mông)</option>
                </optgroup>
                <optgroup label="Á Đông khác">
                    <option value="japanese">日本語 (Tiếng Nhật)</option>
                    <option value="korean">한국어 (Hangul / Old Hangul)</option>
                    <option value="mongol">Монгол (Tiếng Mông Cổ)</option>
                    <option value="nepali">नेपाल (Tiếng Nepal)</option>
                </optgroup>
                <optgroup label="Châu Âu & Khác">
                    <option value="english">English (US, UK)</option>
                    <option value="french">Français (Tiếng Pháp)</option>
                    <option value="german">Deutsch (Deutschland - Đức)</option>
                    <option value="spanish">Español (Tây Ban Nha)</option>
                    <option value="russian">Русский (Tiếng Nga)</option>
                    <option value="greek">Ελληνικά (Ελλάδα - Hy Lạp)</option>
                    <option value="turkish">Türkçe (Türkiye - Thổ Nhĩ Kỳ)</option>
                    <option value="latin">Latina (Latin cổ điển)</option>
                </optgroup>
                <optgroup label="Trung Đông & Nam Á (RTL)">
                    <option value="arabic">العربية (Tiếng Ả Rập chuẩn)</option>
                    <option value="arabic_egypt">العربية (مصر - Ả Rập Ai Cập)</option>
                    <option value="persian">فارسی (Tiếng Ba Tư)</option>
                    <option value="hindi">हिन्दी (Tiếng Hindi)</option>
                </optgroup>
            </select>
        </div>
    </header>

    <div class="main-container">
        <div class="pane">
            <div class="pane-header">
                <span>Nhập liệu (Phonetic / Latin)</span>
                <span id="charCount">0 ký tự</span>
            </div>
            <textarea id="inputBox" placeholder="Nhập văn bản Latinh để chuyển đổi..."></textarea>
        </div>
        <div class="pane">
            <div class="pane-header">
                <span>Kết quả chuyển đổi đích</span>
                <span id="rtlIndicator" class="rtl-badge">RTL Mode</span>
            </div>
            <textarea id="outputBox" placeholder="Kết quả sẽ hiển thị ở đây..." readonly></textarea>
        </div>
    </div>

    <footer>
        <span id="statusInfo">Sẵn sàng (Minimalist SPA IME)</span>
        <span>Dựa trên chuẩn ngữ âm Linguaevum & SinicIME</span>
    </footer>

    <script>
        const rtlLanguages = ['arabic', 'arabic_egypt', 'persian'];
        const input = document.getElementById('inputBox');
        const output = document.getElementById('outputBox');
        const langSelect = document.getElementById('langSelect');
        const charCount = document.getElementById('charCount');
        const rtlIndicator = document.getElementById('rtlIndicator');

        // Khung quy tắc chuyển đổi mẫu (Phonetic mapping rules)
        function convertPhonetic(text, lang) {
            if (!text) return "";
            
            // Xử lý cơ bản mô phỏng chuyển đổi theo quy chuẩn đã chọn
            if (lang === 'mandarin') {
                // Ví dụ đơn giản Pinyin: thay thế số thanh điệu giả lập
                return text.replace(/ni3/g, '你').replace(/hao3/g, '好').replace(/ni hao/g, '你好');
            } else if (lang === 'thai') {
                // RTGS giả lập minh họa
                return text.replace(/krungthep/g, 'กรุงเทพมหานคร').replace(/sawasdee/g, 'สวัสดี');
            } else if (lang === 'han_nom') {
                return text.replace(/xin chao/g, '𠄩 chào').replace(/troi dat/g, '𡗶地');
            }
            
            // Mặc định trả về nguyên bản hoặc ánh xạ thô cho các bộ gõ Latinh mở rộng
            return text;
        }

        function updateIME() {
            const val = input.value;
            const currentLang = langSelect.value;
            
            charCount.innerText = `${val.length} ký tự`;

            // Kiểm tra bật tắt chế độ RTL tự động
            if (rtlLanguages.includes(currentLang)) {
                output.style.direction = 'rtl';
                rtlIndicator.style.display = 'inline';
            } else {
                output.style.direction = 'ltr';
                rtlIndicator.style.display = 'none';
            }

            output.value = convertPhonetic(val, currentLang);
        }

        input.addEventListener('input', updateIME);
        langSelect.addEventListener('change', updateIME);
    </script>
</body>
</html>
