<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SinicIME - Phonetic Web IME</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0ea5e9;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; display: flex; flex-direction: column; }
        header { background: var(--panel-bg); border-bottom: 1px solid var(--border-color); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
        h1 { font-size: 1.1rem; font-weight: 600; color: var(--accent); }
        .lang-select-wrapper { display: flex; align-items: center; gap: 8px; }
        select { background: var(--bg-color); color: var(--text-main); border: 1px solid var(--border-color); padding: 8px 12px; border-radius: 6px; font-size: 0.9rem; outline: none; cursor: pointer; }
        select:focus { border-color: var(--accent); }
        .main-container { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--border-color); }
        @media (max-width: 768px) { .main-container { grid-template-columns: 1fr; } }
        .pane { background: var(--panel-bg); display: flex; flex-direction: column; padding: 20px; }
        .pane-header { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 10px; display: flex; justify-content: space-between; }
        textarea { flex: 1; width: 100%; background: var(--bg-color); color: var(--text-main); border: 1px solid var(--border-color); border-radius: 8px; padding: 15px; font-size: 1.1rem; line-height: 1.6; resize: none; outline: none; }
        textarea:focus { border-color: var(--accent); }
        .hints { margin-top: 10px; font-size: 0.85rem; color: var(--text-muted); background: rgba(0,0,0,0.2); padding: 8px; border-radius: 6px; }
        footer { background: var(--panel-bg); border-top: 1px solid var(--border-color); padding: 10px 20px; font-size: 0.8rem; color: var(--text-muted); display: flex; justify-content: space-between; }
        .rtl-badge { color: #f43f5e; font-weight: 600; display: none; }
    </style>
</head>
<body>

    <header>
        <h1>⌨️ SinicIME Web Engine</h1>
        <div class="lang-select-wrapper">
            <label for="langSelect" style="font-size: 0.85rem; color: var(--text-muted);">Bộ gõ:</label>
            <select id="langSelect">
                <optgroup label="Nhóm Trung Hoa & Việt">
                    <option value="han_nom">漢喃 / Quốc ngữ (Telex)</option>
                    <option value="mandarin">官話 (Mandarin - Pinyin)</option>
                    <option value="min_nan">閩南語 (Hokkien - Pe̍h-ōe-jī)</option>
                    <option value="cantonese">粵語 (Cantonese - Jyutping)</option>
                </optgroup>
                <optgroup label="Đông Nam Á">
                    <option value="thai">ไทย (Tiếng Thái - RTGS)</option>
                    <option value="lao">ລາວ (Tiếng Lào)</option>
                    <option value="khmer">ខែ្មរ (Tiếng Khmer)</option>
                </optgroup>
                <optgroup label="Trung Đông & Khác (RTL)">
                    <option value="arabic">العربية (Tiếng Ả Rập)</option>
                    <option value="persian">فارسی (Tiếng Ba Tư)</option>
                </optgroup>
            </select>
        </div>
    </header>

    <div class="main-container">
        <div class="pane">
            <div class="pane-header">
                <span>Nhập mã phiên âm (Latin)</span>
                <span id="charCount">0 ký tự</span>
            </div>
            <textarea id="inputBox" placeholder="Gõ thử vào đây (vd: ni3 hao3, krungthep, xin chao)..."></textarea>
            <div id="hintBox" class="hints">Gợi ý: Chọn ngôn ngữ và gõ thử ký tự Latinh tương ứng.</div>
        </div>
        <div class="pane">
            <div class="pane-header">
                <span>Văn bản đích (Target Output)</span>
                <span id="rtlIndicator" class="rtl-badge">RTL Mode</span>
            </div>
            <textarea id="outputBox" placeholder="Kết quả hiện ở đây..." readonly></textarea>
        </div>
    </div>

    <footer>
        <span id="statusInfo">Trạng thái: Đang chạy sẵn sàng</span>
        <span>Linguaevum / SinicIME Mobile</span>
    </footer>

    <script>
        const rtlLanguages = ['arabic', 'persian'];
        const input = document.getElementById('inputBox');
        const output = document.getElementById('outputBox');
        const langSelect = document.getElementById('langSelect');
        const charCount = document.getElementById('charCount');
        const rtlIndicator = document.getElementById('rtlIndicator');
        const hintBox = document.getElementById('hintBox');

        const hintsData = {
            'han_nom': 'Gõ kiểu Telex: a + a = â, o + o = ô, d + d = đ, s = sắc...',
            'mandarin': 'Gõ Pinyin kèm số thanh: ni3 hao3 -> 你好',
            'min_nan': 'Gõ Pe̍h-ōe-jī kèm số: peh2 oe3 ji7',
            'cantonese': 'Gõ Jyutping kèm số: gong2 ziu1',
            'thai': 'Gõ RTGS: krungthep -> กรุงเทพมหานคร, sawasdee -> สวัสดี',
            'lao': 'Gõ Latinh hóa tiếng Lào',
            'khmer': 'Gõ phiên âm Khmer',
            'arabic': 'Hỗ trợ tự động đảo chiều RTL',
            'persian': 'Hỗ trợ tự động đảo chiều RTL'
        };

        // Từ điển quy tắc chuyển đổi mẫu mô phỏng nhanh
        const mappingRules = {
            'mandarin': (text) => {
                return text
                    .replace(/ni3/g, '你')
                    .replace(/hao3/g, '好')
                    .replace(/ni hao/g, '你好')
                    .replace(/zhong1guo2/g, '中國');
            },
            'thai': (text) => {
                return text
                    .replace(/krungthep/gi, 'กรุงเทพมหานคร')
                    .replace(/sawasdee/gi, 'สวัสดี')
                    .replace(/farang/gi, 'ฝรั่ง');
            },
            'han_nom': (text) => {
                // Mô phỏng gõ tiếng Việt / Hán Nôm cơ bản
                return text
                    .replace(/xin chao/gi, '𠄩chào')
                    .replace(/troi dat/gi, '𡗶地')
                    .replace(/viet nam/gi, ' Việt Nam');
            },
            'cantonese': (text) => {
                return text.replace(/gong2/g, '講').replace(/nei5/g, '你');
            },
            'min_nan': (text) => {
                return text.replace(/tsun2/g, '春');
            }
        };

        function updateIME() {
            const val = input.value;
            const currentLang = langSelect.value;
            
            charCount.innerText = `${val.length} ký tự`;
            hintBox.innerText = hintsData[currentLang] || 'Sẵn sàng nhận dữ liệu gõ.';

            if (rtlLanguages.includes(currentLang)) {
                output.style.direction = 'rtl';
                rtlIndicator.style.display = 'inline';
            } else {
                output.style.direction = 'ltr';
                rtlIndicator.style.display = 'none';
            }

            // Thực hiện chuyển đổi nếu có luật, ngược lại giữ nguyên bản
            if (mappingRules[currentLang]) {
                output.value = mappingRules[currentLang](val);
            } else {
                output.value = val;
            }
        }

        input.addEventListener('input', updateIME);
        langSelect.addEventListener('change', updateIME);
        updateIME();
    </script>
</body>
</html>
